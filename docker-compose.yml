services:
  redis:
    image: redis:7
    container_name: recommendation-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    container_name: recommendation-postgres
    environment:
      POSTGRES_DB: recommendations
      POSTGRES_USER: recommendation_user
      POSTGRES_PASSWORD: recommendation_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.0
    container_name: recommendation-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Default for auto-created topics (Task 16: 3 partitions)
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  # Ensures user-interactions exists with 3 partitions (create or alter).
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: recommendation-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BOOTSTRAP=kafka:29092
        TOPIC=user-interactions
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP \
          --create --if-not-exists --topic $$TOPIC --partitions 3 --replication-factor 1
        # Increase if an older topic had fewer partitions; ignore "already has N" errors.
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP \
          --alter --topic $$TOPIC --partitions 3 || true
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP \
          --describe --topic $$TOPIC
    restart: "no"

  # Task 17 — Apicurio Registry (small image; Confluent-compatible Avro API)
  # In-memory store: fine for local learning; schemas reset on container recreate.
  schema-registry:
    image: quay.io/apicurio/apicurio-registry-mem:2.6.5.Final
    container_name: recommendation-schema-registry
    hostname: schema-registry
    ports:
      - "8081:8080"
    environment:
      REGISTRY_CCOMPAT_LEGACY_ID_MODE_ENABLED: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8080/health/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    container_name: recommendation-service
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_TIMEOUT=0.05
      - CACHE_TTL=60
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=recommendations
      - POSTGRES_USER=recommendation_user
      - POSTGRES_PASSWORD=recommendation_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=user-interactions
      - KAFKA_CONSUMER_GROUP=recommendation-service
      - SCHEMA_REGISTRY_URL=http://schema-registry:8080/apis/ccompat/v7
      - KAFKA_VALUE_SUBJECT=user-interactions-value
      - MODEL_VERSION=v1

  # Scale with: docker compose up -d --scale kafka-consumer=3
  # (no fixed container_name so Compose can create multiple replicas)
  kafka-consumer:
    build: .
    command: ["python", "-u", "-m", "app.kafka_consumer"]
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - REDIS_TIMEOUT=0.05
      - CACHE_TTL=60
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=recommendations
      - POSTGRES_USER=recommendation_user
      - POSTGRES_PASSWORD=recommendation_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=user-interactions
      - KAFKA_CONSUMER_GROUP=recommendation-service
      - SCHEMA_REGISTRY_URL=http://schema-registry:8080/apis/ccompat/v7
      - KAFKA_VALUE_SUBJECT=user-interactions-value
    restart: unless-stopped

volumes:
  postgres_data:
