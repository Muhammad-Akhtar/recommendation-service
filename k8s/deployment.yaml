apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service-v1
  labels:
    app: recommendation-service
    version: v1
spec:
  # Task 24 baseline for load testing + HPA (Task 13 taught manual scale)
  replicas: 3

  selector:
    matchLabels:
      app: recommendation-service
      version: v1

  template:
    metadata:
      labels:
        app: recommendation-service
        version: v1

    spec:
      containers:
        - name: recommendation-service
          image: recommendation-service:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          env:
            - name: SERVICE_VERSION
              value: "v1"
            # Fail fast if Redis/Postgres are not in-cluster (Compose may be separate)
            - name: REDIS_TIMEOUT
              value: "0.2"

          # Required for CPU-based HPA (Task 24)
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            # /ready allows popular-fallback even if Redis/Postgres are down
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
